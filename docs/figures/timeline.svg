<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .t { fill: #1f2328; font-size: 13px; }
    .s { fill: #59636e; font-size: 12px; }
    .d { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .cell { fill: #e6e6e6; stroke: #ffffff; stroke-width: 1; }
    .black { fill: #111111; }
    .prog { fill: none; stroke: #8c959f; stroke-dasharray: 4 3; }
    .pop { fill: #e5534b; }
    .popl { stroke: #e5534b; stroke-width: 1.5; }
    .dim { stroke: #59636e; stroke-width: 1; fill: none; }
    .tick { stroke: #8c959f; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .t, .d { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .cell { fill: #d0d0d0; stroke: #0d1117; }
      .black { fill: #000000; stroke: #3d444d; stroke-width: 1; }
      .dim { stroke: #9198a1; }
      .d { fill: #1f2328; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- section labels -->
  <text class="t" x="40" y="22" font-weight="600">Head leader</text>
  <text class="s" x="132" y="22">8 s</text>
  <text class="t" x="400" y="22" font-weight="600">Program</text>
  <text class="t" x="520" y="22" font-weight="600">Tail leader</text>
  <text class="s" x="604" y="22">8 s</text>

  <!-- head: countdown seconds 8..3, then black -->
  <rect class="cell" x="40"  y="70" width="40" height="40"/><text class="d" x="60"  y="95">8</text>
  <rect class="cell" x="80"  y="70" width="40" height="40"/><text class="d" x="100" y="95">7</text>
  <rect class="cell" x="120" y="70" width="40" height="40"/><text class="d" x="140" y="95">6</text>
  <rect class="cell" x="160" y="70" width="40" height="40"/><text class="d" x="180" y="95">5</text>
  <rect class="cell" x="200" y="70" width="40" height="40"/><text class="d" x="220" y="95">4</text>
  <rect class="cell" x="240" y="70" width="40" height="40"/><text class="d" x="260" y="95">3</text>
  <rect class="black" x="280" y="70" width="80" height="40"/>
  <rect class="black" x="40" y="70" width="3" height="40"/>

  <!-- program -->
  <rect class="prog" x="364" y="70" width="152" height="40"/>
  <text class="s" x="440" y="95" text-anchor="middle">first frame … last frame</text>

  <!-- tail: black, pop at 2 s -->
  <rect class="black" x="520" y="70" width="320" height="40"/>

  <!-- pops -->
  <rect class="pop" x="280" y="70" width="4" height="40"/>
  <rect class="pop" x="600" y="70" width="4" height="40"/>
  <line class="popl" x1="282" y1="44" x2="282" y2="66"/>
  <line class="popl" x1="602" y1="44" x2="602" y2="66"/>
  <text class="t" x="282" y="40" text-anchor="middle">“2” + pop</text>
  <text class="t" x="602" y="40" text-anchor="middle">“2” + pop</text>
  <line class="tick" x1="41" y1="44" x2="41" y2="66"/>
  <text class="s" x="41" y="40">PICTURE START</text>

  <!-- FFOA / LFOA -->
  <line class="tick" x1="360" y1="110" x2="360" y2="160"/>
  <line class="tick" x1="520" y1="110" x2="520" y2="160"/>
  <text class="s" x="360" y="176" text-anchor="middle">first frame of action</text>
  <text class="s" x="520" y="176" text-anchor="middle">last frame of action</text>

  <!-- dimensions -->
  <line class="dim" x1="284" y1="132" x2="356" y2="132" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="t" x="320" y="150" text-anchor="middle">48 frames</text>
  <line class="dim" x1="524" y1="132" x2="598" y2="132" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="t" x="561" y="150" text-anchor="middle">48 frames</text>
  <text class="s" x="840" y="150" text-anchor="end">50 at 25 fps</text>
</svg>
